name: Questie native preview
on:
  push:
    branches: [questie-rive-v4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run scripts/build-questie-guides.ts
      - run: bunx playwright-core install --with-deps chromium
      - run: bun run scripts/test-questie-preview.ts
      - uses: actions/upload-artifact@v4
        with:
          name: questie-native-preview
          path: questie-site/
          if-no-files-found: error
