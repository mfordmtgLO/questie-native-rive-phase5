name: Questie Phase 5.3 micro companion
on:
  push:
    branches: [phase-5.3-pin-reference]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  micro-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run scripts/build-questie-guides.ts
      - run: bunx playwright-core install --with-deps chromium
      - run: bun run scripts/test-questie-micro.ts
      - uses: actions/upload-artifact@v4
        with:
          name: pin-micro-preview
          path: questie-site/pin-micro-*.png
